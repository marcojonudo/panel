stages:
    - build
    - assemble
    - versioning
    - tagging
    - docker
    - deploy

.fetch_ci_scripts: &fetch_ci_scripts
    - apk update && apk add git
    - export SCRIPTS_DIR=$(mktemp -d)
    - git clone -q --depth 1 "$SCRIPTS_REPO" "$SCRIPTS_DIR"
    - chmod +x $SCRIPTS_DIR/shell/docker.sh
    - 'find $SCRIPTS_DIR/shell -type f -iname "*.sh" -exec chmod +x {} \;'

.gradle_template: &gradle_template
    tags:
        - sidesman2
    variables:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    cache:
        key: "$CI_COMMIT_REF_NAME"
        policy: push
        paths:
            - build
            - .gradle
    artifacts:
        paths:
            - server/build/libs/*.jar
        expire_in: 1 hour

.get_version_template: &get_version_template
    tags:
        - gitlab-org
    before_script:
        - *fetch_ci_scripts
    artifacts:
        paths:
            - version
        expire_in: 1 hour

.deploy_template: &deploy_template
    tags:
        - sidesman2
    before_script:
        - *fetch_ci_scripts
        - apk upgrade --update && apk add openssh sshpass bash
    script:
        - $SCRIPTS_DIR/shell/deploy.sh
    when: manual
    only:
        - branches

build:backend:
    stage: build
    image: gradle:alpine
    <<: *gradle_template
    script:
        - gradle --build-cache :server:build
    only:
        - branches

build:frontend:
    stage: build
    image: gradle:5.6.4
    script:
        - gradle --build-cache buildAndCopyClientResources
    artifacts:
        paths:
            - server/build/resources/client/static
        expire_in: 1 hour
    cache:
        paths:
            - node_modules/
    only:
        - branches

assemble:jar:
    stage: assemble
    image: gradle:alpine
    <<: *gradle_template
    dependencies:
        - build:frontend
    script:
        - gradle --build-cache :server:shadowJar
    only:
        - branches

get-version:dev:
    stage: versioning
    <<: *get_version_template
    script:
        - echo $CURRENT_VERSION
        - $SCRIPTS_DIR/shell/getDevVersion.sh > version
    only:
        - branches
    except:
        - master
#        - development

get-version:merge-request:
    stage: versioning
    <<: *get_version_template
    script:
        - echo $CURRENT_VERSION
        - $SCRIPTS_DIR/shell/getMergeRequestVersion.sh > version
    only:
        - merge_requests

tagging:git:
    stage: tagging
    tags:
        - gitlab-org
    dependencies:
        - get-version:dev
        - get-version:merge-request
    before_script:
        - *fetch_ci_scripts
        - CURRENT_VERSION=$(git describe --tags)
        - PROJECT_VERSION=$(cat ./version)
        - echo Updating from $CURRENT_VERSION to $PROJECT_VERSION
    script:
        - $SCRIPTS_DIR/shell/gitTag.sh
    only:
        - merge_requests
        - branches

build:docker:
    stage: docker
    image: docker:latest
    services:
        - docker:dind
    dependencies:
        - assemble:jar
        - get-version:dev
        - get-version:merge-request
    before_script:
        - *fetch_ci_scripts
    script:
        - $SCRIPTS_DIR/shell/docker.sh
    only:
        - branches

deploy:sta:
    stage: deploy
    <<: *deploy_template
    variables:
        ENVIRONMENT: sta

deploy:prod:
    stage: deploy
    <<: *deploy_template
    variables:
        ENVIRONMENT: prod
