stages:
    - build
    - assemble
    - versioning
    - docker
    - deploy

.fetch_ci_scripts: &fetch_ci_scripts
    - export SCRIPTS_DIR=$(mktemp -d)
    - git clone -q --depth 1 "$SCRIPTS_REPO" "$SCRIPTS_DIR"
    - chmod -R +x $SCRIPTS_DIR

.gradle_template: &gradle_template
    tags:
        - sidesman2
    image: registry.gitlab.com/marco_fv/ci-scripts:gradle
    variables:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    cache:
        key: "$CI_COMMIT_REF_NAME"
        policy: push
        paths:
            - build
            - .gradle
    artifacts:
        paths:
            - build/libs/*.jar
        expire_in: 1 hour

.get_version_template: &get_version_template
    tags:
        - gitlab-org
    image: registry.gitlab.com/marco_fv/ci-scripts:groovy
    before_script:
        - *fetch_ci_scripts
    artifacts:
        paths:
            - version
        expire_in: 1 year

.deploy_template: &deploy_template
    stage: deploy
    image: registry.gitlab.com/marco_fv/ci-scripts:groovy
    tags:
        - sidesman2
    dependencies:
        - get-version:hash
        - get-version:semantic:push
    before_script:
        - *fetch_ci_scripts
    script:
        - groovy -cp $SCRIPTS_DIR/groovy $SCRIPTS_DIR/groovy/deploy.groovy
    only:
        - branches

build:backend:
    stage: build
    <<: *gradle_template
    script:
        - gradle --build-cache :server:build
    only:
        - branches

build:frontend:
    stage: build
    image: gradle:5.6.4
    script:
        - gradle --build-cache buildAndCopyClientResources
    artifacts:
        paths:
            - server/build/resources/client/static
        expire_in: 1 day
    cache:
        paths:
            - node_modules/
    only:
        - branches

assemble:jar:
    stage: assemble
    <<: *gradle_template
    dependencies:
        - build:frontend
    script:
        - gradle --build-cache :server:shadowJar
    artifacts:
        paths:
            - server/build/libs/*.jar
        expire_in: 1 day
    only:
        - branches

get-version:hash:
    stage: versioning
    <<: *get_version_template
    script:
        - groovy -cp $SCRIPTS_DIR/groovy $SCRIPTS_DIR/groovy/getHashVersion.groovy
    only:
        - branches
    except:
        - master
        - development

get-version:semantic:push:
    stage: versioning
    <<: *get_version_template
    script:
        - groovy -cp $SCRIPTS_DIR/groovy $SCRIPTS_DIR/groovy/getSemanticPushVersion.groovy
    only:
        - master
        - development

get-version:semantic:merge_request:
    stage: versioning
    <<: *get_version_template
    script:
        - groovy -cp $SCRIPTS_DIR/groovy $SCRIPTS_DIR/groovy/getSemanticVersion.groovy
    only:
        - merge_requests

build:docker:
    stage: docker
    image: registry.gitlab.com/marco_fv/ci-scripts:docker
    services:
        - docker:dind
    dependencies:
        - assemble:jar
        - get-version:hash
        - get-version:semantic:push
    before_script:
        - *fetch_ci_scripts
    script:
        - $SCRIPTS_DIR/shell/docker.sh
    only:
        - branches

deploy:manual:sta:
    <<: *deploy_template
    only:
        - branches
    except:
        - schedules
    variables:
        ENVIRONMENT: sta
    when: manual

deploy:manual:prod:
    <<: *deploy_template
    only:
        - branches
    except:
        - schedules
    variables:
        ENVIRONMENT: prod
    when: manual

deploy:scheduled:sta:
    <<: *deploy_template
    only:
        - schedules
    variables:
        ENVIRONMENT: sta

deploy:scheduled:prod:
    <<: *deploy_template
    only:
        - schedules
    variables:
        ENVIRONMENT: prod