micronaut:
    application:
        name: panel
    server:
        port: 8083
        cors:
            enabled: true
    router:
        static-resources:
            default:
                mapping: /**
                paths: [classpath:static]
    http:
        client:
            read-timeout: 30s

endpoints:
    beans:
        enabled: true
        sensitive: false
    info:
        enabled: true
        sensitive: false
    health:
        enabled: true
        sensitive: false
    refresh:
        enabled: true
        sensitive: false
    routes:
        enabled: true
        sensitive: false
    loggers:
        enabled: true
        sensitive: false

host.ip: ${HOST_IP:localhost}

cron:
    sync-jpdv-orders: '0 0 0 1 1 ?'


