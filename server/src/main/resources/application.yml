micronaut:
    application:
        name: panel
    server:
        port: 8083
        cors:
            enabled: true
    router:
        static-resources:
            default:
                mapping: /**
                paths: [classpath:static]
    http:
        client:
            read-timeout: 30s

endpoints:
    beans:
        enabled: true
        sensitive: false
    info:
        enabled: true
        sensitive: false
    health:
        enabled: true
        sensitive: false
    refresh:
        enabled: true
        sensitive: false
    routes:
        enabled: true
        sensitive: false
    loggers:
        enabled: true
        sensitive: false

host.ip: ${HOST_IP:localhost}

cron:
    sync-jpdv-orders: '0 0 0 1 1 ?'

host:
    ip: ${HOST_IP:localhost}
    local-mysql-port: ${MYSQL_PORT:3306}

database:
    credentials:
        username: root
        password: root

hibernate:
    hbm2ddl:
        auto: 'none'

ifv:
    path: https://cuboifv.cloudapp.net:8086/api
    username: PortalIFVuser
    password: ifvRest18$
    centre: ABS

dataSource:
    dbCreate: validate
    driverClassName: com.mysql.jdbc.Driver
    dialect: org.hibernate.dialect.MySQL5InnoDBDialect
    url: jdbc:mysql://${host.ip}:${host.local-mysql-port}/panel?useSSL=false
    username: ${database.credentials.username}
    password: ${database.credentials.password}
    properties:
        initialSize: 1
        maxActive: 1
        minIdle: 1
        maxIdle: 1
        testOnBorrow: true
        validationQuery: SELECT 1
        validationInterval: 15000
    logSql: true

dataSources:
    schedules:
        dbCreate: validate
        driverClassName: com.mysql.jdbc.Driver
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect
        url: jdbc:mysql://${host.ip}:${host.local-mysql-port}/schedules?useSSL=false
        username: ${database.credentials.username}
        password: ${database.credentials.password}
        properties:
            initialSize: 1
            maxActive: 1
            minIdle: 1
            maxIdle: 1
            testOnBorrow: true
            validationQuery: SELECT 1
            validationInterval: 15000
        logSql: true
    fviberi:
        dbCreate: validate
        driverClassName: com.mysql.jdbc.Driver
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect
        url: jdbc:mysql://${host.ip}:${host.local-mysql-port}/fviberi?useSSL=false
        username: ${database.credentials.username}
        password: ${database.credentials.password}
        properties:
            initialSize: 1
            maxActive: 1
            minIdle: 1
            maxIdle: 1
            testOnBorrow: true
            validationQuery: SELECT 1
            validationInterval: 15000
        logSql: true
