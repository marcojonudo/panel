<div class="container-fluid d-flex flex-column w-100 h-100">
  <div
    class="row flex-grow-1">
    <div class="col h-100 padding-0 days-panels-container">
      <app-day-panel
        *ngFor="let dayPanel of daysPanels | days: (oneDayMode$ | async)"
        class="h-100"
        (scrollLeftEmitter)="setScrollLeft($event)"
        [scrollLeft]="scrollLeft"></app-day-panel>
    </div>
  </div>
  <div class="row unassigned-orders-container">
    <div class="col padding-0">
      <app-band class="w-100"></app-band>
    </div>
  </div>
</div>
<router-outlet></router-outlet>
