<div
	*ngFor="let appointment of mechanic.appointments; let i = index"
	class="d-flex bg-white"
	[style.height.px]="lineDefaultHeight">
	<div class="d-flex flex-column">
		<label
			for="appointment-{{i}}-type-input"
			class="h-50 align-center appointment-type-schedule-label">
			{{getScheduleTypeName(schedule.type, i)}}
		</label>
		<select
			id="appointment-{{i}}-type-input"
			class="h-50 align-center"
			[ngModel]="appointment.appointmentType?.code"
			(change)="updateAppointmentType(appointment, $event.target.value)">
			<option value=""></option>
			<option *ngFor="let appointmentType of appointmentTypes" value="{{appointmentType.code}}">
				{{appointmentType.code}}
			</option>
		</select>
	</div>
	<div class="flex-grow-1 flex-basis-0 d-flex border-top border-bottom">
		<div
			*ngFor="let hourQuarters of schedule.intervals[i].hourQuarters"
			class="h-100 d-flex flex-column appointment-type-hour">
			<div class="h-50 d-flex align-items-center pl-1 border-bottom border-right">{{hourQuarters.hour}}</div>
			<div *ngIf="appointment.appointmentType" class="flex-grow-1 flex-basis-0 d-flex">
				<div
					*ngFor="let quarter of quarters"
					appDraggableSchedule
					(updateSchedule)="updateAppointmentSchedule(appointment, i, $event)"
					[appointmentTypeScheduleSubject]="appointmentTypeScheduleSubject"
					[initialDragInfo]="{hour: hourQuarters.hour, quarter: quarter, type: hourQuarters.type}"
					class="flex-grow-1 flex-basis-0 appointment-type-quarter"
					[ngClass]="{
						'border-right': quarter != undefined,
						'disabled': isQuarterDisabled(quarter, hourQuarters.quarters)
					}"
					[style.background-color]="isScheduleSelected(hourQuarters.hour, quarter, hourQuarters.type) ? appointment.appointmentType.color : 'transparent'">
				</div>
			</div>
			<div *ngIf="!appointment.appointmentType" class="flex-grow-1 flex-basis-0 disabled"></div>
		</div>
	</div>
</div>
<div>{{check()}}</div>
