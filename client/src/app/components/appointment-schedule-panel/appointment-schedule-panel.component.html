<div
	*ngFor="let scheduleType of schedule.minutes; let i = index"
	class="h-50 d-flex"
	[ngClass]="{'h-100': schedule.minutes.length == 1}">
	<div class="d-flex flex-column">
		<label
			for="appointment-{{appointmentsSchedules[i]?.schedule.type}}-type-input"
			class="h-50 align-center appointment-type-schedule-label">
			{{getScheduleTypeName(schedule.type, i)}}
		</label>
		<select
			id="appointment-{{appointmentsSchedules[i]?.schedule.type}}-type-input"
			class="h-50 align-center"
			[(ngModel)]="appointmentsSchedules[i]?.appointmentType.code"
			(change)="addAppointmentType(appointmentsSchedules[i]?.appointmentType.code)">
			<option></option>
			<option *ngFor="let appointmentType of appointmentTypes" value="{{appointmentType.code}}">
				{{appointmentType.code}}
			</option>
		</select>
	</div>
	<div class="flex-grow-1 flex-basis-0 d-flex border-top border-bottom">
		<div
			*ngFor="let hour of schedule.hours[i]"
			class="h-100 d-flex flex-column appointment-type-hour">
			<div class="flex-grow-1 flex-basis-0 d-flex align-items-center pl-1 border-bottom border-right">{{hour}}</div>
			<div class="flex-grow-1 flex-basis-0 d-flex">
				<div
					*ngFor="let quarter of findHourQuarters(schedule.quarters[i])"
					appDraggableSchedule
					[appointmentTypeScheduleSubject]="appointmentTypeScheduleSubject"
					[initialDragInfo]="{hour: hour, quarter: quarter, type: getScheduleType(schedule.type, i)}"
					class="flex-grow-1 flex-basis-0 appointment-type-quarter"
					[ngClass]="{
						'border-right': quarter != undefined,
						'disabled': quarter == undefined,
						'selected-schedule': isScheduleSelected(hour, quarter, getScheduleType(schedule.type, i))
					}">
				</div>
			</div>
		</div>
	</div>
</div>
<div>{{check()}}</div>
