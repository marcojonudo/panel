<div
	class="h-100 d-flex align-items-center mechanic-info border-right-2 border-semi-dark"
	[ngClass]="{'mechanic-info-highlight': checkHighlightMechanic()}">
	<div
		*ngIf="oneDayMode; else minLayout"
		class="d-flex border-top border-bottom border-semi-dark"
		[style.height.px]="defaultHeight">
		<div class="w-70 d-flex flex-column">
			<div
				class="w-100 h-25 d-flex align-items-center mechanic-name pl-1"
				(click)="toggleAppointmentSchedulesDialog()">
				{{mechanic.personalData.completeName}}
			</div>
			<div
				class="w-100 h-75 d-flex flex-wrap align-items-center justify-content-between mechanic-skills-container border-top border-semi-dark"
				(click)="showSkills(mechanic.skills, mechanic.day, mechanic.code)">
				<div
					*ngFor="let skill of mechanic.highlightedSkills"
					class="rounded-circle skill align-center"
					[ngStyle]="getSkillColorObject(skill)">{{skill.code}}</div>
			</div>
		</div>
		<div class="w-30 d-flex flex-column border-left border-semi-dark">
			<div class="w-100 h-75 d-flex flex-wrap border-bottom border-semi-dark">
				<div class="w-100 h-65 align-center mechanic-position">{{position}}</div>
				<div
					class="w-50 h-35 align-center"
					(click)="checkRemoveMechanic(deleteScheduleModal)">
					<i class="far fa-trash-alt"></i>
				</div>
				<div class="w-50 h-35 align-center ml-auto"><i class="fas fa-arrows-alt-v"></i></div>
			</div>
			<div class="w-100 h-25">
				<select
					class="w-100 h-100 align-center job-line-type-select"
					[style.background-color]="findJobLineTypeColor(mechanic.jobLineType)"
					[(ngModel)]="mechanic.jobLineType"
					(change)="updateJobLineType()">
					<option></option>
					<option *ngFor="let jobLineType of jobLineTypes" value="{{jobLineType.code}}">
						{{jobLineType.code}}
					</option>
				</select>
			</div>
		</div>
	</div>
	<ng-template #minLayout>
		<div class="h-100 d-flex">
			<div class="w-50 h-100">
				<div class="w-100 h-50 d-flex align-items-center pl-1">{{mechanic.personalData.name}}</div>
				<div class="w-100 h-50 pl-1">S</div>
			</div>
			<div class="w-50 h-100 d-flex flex-wrap">
				<div class="w-100 d-flex justify-content-around align-items-center">
					<div class="rounded-circle ability align-center">N</div>
					<div class="rounded-circle ability align-center">AC</div>
					<div class="rounded-circle ability align-center">AL</div>
					<div class="rounded-circle ability align-center">FR</div>
				</div>
				<div class="w-100 d-flex justify-content-around align-items-center">
					<div class="rounded-circle ability align-center">AM</div>
					<div class="rounded-circle ability align-center">DIS</div>
					<div class="rounded-circle ability align-center">ENG</div>
					<div class="rounded-circle ability align-center">AA</div>
				</div>
			</div>
		</div>
	</ng-template>
</div>
<app-appointment-schedule-panel
	*ngIf="showAppointmentSchedulesDialog"
	class="appointment-schedule-panel-container"
	[ngStyle]="{'left.px': mechanicInfoWidth, 'height.px': defaultHeight}"
	[schedule]="mechanic.schedule"
	[mechanic]="mechanic"></app-appointment-schedule-panel>
<ng-template #deleteScheduleModal let-modal>
	<div class="modal-header">
		<h4 class="modal-title" id="modal-basic-title">!Atención!</h4>
	</div>
	<div class="modal-body">
		Estás a punto de eliminar un mecánico que tiene fichas asignadas. Si lo haces, todas ellas bajarán a la cinta.
	</div>
	<div class="modal-footer">
		<button type="button" class="btn btn-info" (click)="modal.dismiss()">Descartar</button>
		<button type="button" class="btn btn-warning" (click)="modal.close()">Continuar</button>
	</div>
</ng-template>
<div>{{check()}}</div>
