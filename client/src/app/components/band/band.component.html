<div class="d-flex flex-column h-100">
	<div class="d-flex h-25 unassigned-orders-buttons-container">
		<!--<button class="btn btn-outline-dark align-center padding-0">Ocultar</button>-->
		<button class="btn btn-danger align-center padding-0">En curso</button>
		<button class="btn btn-primary align-center padding-0">Cita previa</button>
	</div>
	<div
		appDropzone
		class="align-items-center flex-grow-1 unassigned-orders-cards-container d-flex pl-3">
		<app-draggable-group
			*ngFor="let cardsGroup of unassignedCardsGroups; let i = index"
			class="cards-height"
			[ngClass]="{'mr-2': checkMarginBetweenGroups(cardsGroup, i)}"
			[cardsGroup]="cardsGroup">
		</app-draggable-group>
	</div>
</div>
<div>{{check()}}</div>
