<div class="d-flex h-100 timeline">
	<div *ngFor="let hour of maxScheduleHours" class="flex-grow-1 flex-basis-0 timeline-hour d-flex border-right-2 border-semi-dark">
		<div *ngFor="let quarter of quarters; first as isFirst"
			class="flex-grow-1 flex-basis-0 align-center border-right border-semi-dark"
			[ngClass]="{'quarter': isFirst}">
			<span *ngIf="isFirst">{{hour}}<span *ngIf="hourPercentage >= hourPercentageDisplayMinutesThreshold">:</span></span>
			<span *ngIf="hourPercentage >= hourPercentageDisplayMinutesThreshold">{{quarter}}</span>
		</div>
	</div>
</div>
<div>{{check()}}</div>
