<div
	class="d-flex h-100 timeline"
	[ngStyle]="{background: calcTimelineBackground()}">
	<div *ngFor="let hour of maxScheduleHours" class="flex-grow-1 flex-basis-0 timeline-hour d-flex">
		<div *ngFor="let quarter of quarters; first as isFirst"
			class="flex-grow-1 flex-basis-0 align-center"
			[ngClass]="{'quarter': isFirst}">
			<span *ngIf="isFirst">{{hour}}<span *ngIf="displayMinutes">:</span></span>
			<span *ngIf="displayMinutes">{{quarter}}</span>
		</div>
	</div>
</div>
<div>{{check()}}</div>
