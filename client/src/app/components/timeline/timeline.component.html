<div
	class="d-flex h-100 timeline">
	<div *ngFor="let hour of maxScheduleHours" class="flex-grow-1 flex-basis-0 d-flex">
		<div *ngFor="let quarter of quarters; let first = first; let last = last"
			class="flex-grow-1 flex-basis-0 d-flex align-items-center justify-content-start pl-1 quarter-border border-semi-dark"
			[ngClass]="{'quarter hour-border border-semi-dark': first, 'red-background': findQuarterBackground(hour, +quarter)}">
			<span *ngIf="first">{{hour}}<span *ngIf="checkDisplayMinutes()">:</span></span>
			<span *ngIf="checkDisplayMinutes()">{{quarter}}</span>
		</div>
	</div>
</div>
<div>{{check()}}</div>
