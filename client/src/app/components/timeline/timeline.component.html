<div class="d-flex h-100 timeline">
	<div *ngFor="let hour of maxScheduleHours" class="flex-grow-1 flex-basis-0 d-flex border-right-2 border-semi-dark">
		<div
			*ngFor="let quarter of quarters; first as isFirst"
			class="flex-grow-1 flex-basis-0 quarter"
			[ngClass]="(percentageWidth$ | async) < displayMinutesThreshold ? 'align-center' : 'pl-1'">
			<span *ngIf="isFirst">{{hour}}<span *ngIf="(percentageWidth$ | async) >= displayMinutesThreshold">:{{quarter}}</span></span>
		</div>
	</div>
</div>
<div>{{check()}}</div>
