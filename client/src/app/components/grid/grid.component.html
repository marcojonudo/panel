<div
	class="w-100 h-100 d-flex flex-column grid"
	cdkDropList
	(cdkDropListDropped)="drop($event)">
	<app-mechanic-line-container
		*ngFor="let mechanic of mechanics"
		[style.margin-bottom.px]="mechanicBottomMargin"
		[day]="day"
		[mechanic]="mechanic"
		[groups]="findMechanicGroups(mechanic.code)"
		[mechanicLineUpdate]="findMechanicLineUpdates(mechanic.code)"
		[mechanicSkills]="findMechanicSkills(mechanic.code)"
		[showAppointmentsName]="showAppointmentsName"
		[appointments]="mechanic.appointments"
		[position]="mechanic.mechanicPanelInfo.position"
		[groupUpdates]="findGroupsUpdate(mechanic.code)">
	</app-mechanic-line-container>
</div>
<div>{{check()}}</div>
