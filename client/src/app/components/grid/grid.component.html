<div
	class="w-100 h-100 d-flex flex-column grid"
	cdkDropList
	(cdkDropListDropped)="drop($event)">
	<app-mechanic-line-container
		*ngFor="let mechanic of mechanics"
		class="mechanic-line-container-wrapper"
		[day]="day"
		[mechanic]="mechanic"
		[height]="mechanic.height"
		[appointments]="mechanic.appointments"
		[position]="mechanic.panelPosition"
		[maxScheduleHours]="maxScheduleHours"
		[maxScheduleWidth]="maxScheduleWidth"></app-mechanic-line-container>
</div>
<div>{{check()}}</div>
