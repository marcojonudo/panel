<div
	class="w-100 h-100 d-flex flex-column grid"
	cdkDropList
	(cdkDropListDropped)="drop($event)">
	<app-mechanic-line-container
		*ngFor="let mechanic of mechanics"
		[style.margin-bottom.px]="mechanicBottomMargin"
		[day]="day"
		[mechanic]="mechanic"
		[maxScheduleWidth]="maxScheduleWidth"
		[mechanicLineUpdate]="checkTriggerMechanicLineCd(mechanic.code)"
		[dayMechanicSkills]="checkTriggerMechanicInfoCd(mechanic.code)"
		[appointments]="mechanic.appointments"
		[position]="mechanic.panelPosition">
	</app-mechanic-line-container>
</div>
<div>{{check()}}</div>
