<div
	class="h-100 d-flex flex-column skills-container border-left-2 border-semi-dark"
	[style.width.px]="skillsPanelWidth">
	<div
		*ngFor="let skill of skills"
		class="flex-grow-1 flex-basis-0 d-flex skill align-items-center border-bottom"
		[ngClass]="{'parent-skill pl-1': skill.children.length, 'pl-2': !skill.children.length}">
		<div>{{skill.name}}</div>
		<div
			class="rounded-circle skill-expertise-color ml-auto mr-1"
			[style.background-color]="getSkillExpertiseColor(skill)">
		</div>
	</div>
</div>
