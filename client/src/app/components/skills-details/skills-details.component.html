<div id="skills-container">
	<div
		*ngFor="let skill of buildAllSkillsArray()"
		class="skill-row"
		[ngStyle]="skill.style.toStyle()"
		[ngClass]="{'parent-skill': skill.children.length, 'child-skill': !skill.children.length}">
		<div *ngIf="skill.code" class="skill-badge-container">
			<div class="skill-badge" [ngStyle]="findSkillBadgeStyle(skill)">
				<div>{{skill.code.code}}</div>
			</div>
		</div>
		<svg
			*ngIf="!skill.children.length && !skill.code"
			viewBox="0 0 120 120"
			xmlns="http://www.w3.org/2000/svg">
			<circle fill="red" cx="60" cy="60" r="50" [ngClass]="findExpertiseBadgeClass(skill)"/>
		</svg>
		<div class="skill-name">{{skill.name}}</div>
	</div>
</div>
