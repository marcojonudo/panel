<div
	class="h-100 panel-card resizable"
	[style.width.px]="card.width">
	<div class="h-100 d-flex flex-column">
		<div class="flex-grow-1 flex-basis-0 d-flex">
			<div class="flex-grow-1 flex-basis-0 align-center">
				{{card.order.code}}
			</div>
			<div class="flex-grow-1 flex-basis-0 align-center">
				<div class="card-state-indicator" [style.background-color]="getOrderStateColor(this.card.order.state)"></div>
			</div>
			<div class="flex-grow-1 flex-basis-0 align-center">
				{{card.order.deadline | date: 'HH:mm'}}
			</div>
		</div>
		<div class="flex-grow-1 flex-basis-0 d-flex">
			<div class="flex-grow-1 flex-basis-0 align-center">
			</div>
			<div class="flex-grow-1 flex-basis-0 align-center">
				{{card.group.shortName}}
			</div>
			<div class="flex-grow-1 flex-basis-0 align-center">
			</div>
		</div>
		<div class="flex-grow-1 flex-basis-0 d-flex card-bottom-section" [style.background]="card.group.color.code">
			<div class="flex-grow-1 flex-basis-0 align-center">
			</div>
			<div class="flex-grow-1 flex-basis-0 align-center">
			</div>
			<div class="flex-grow-1 flex-basis-0 align-center">
			</div>
		</div>
	</div>
	<div class="w-100 h-100 d-flex justify-content-between align-items-center link-cards-container">
		<div (click)="linkPrevious(card, card.linkedPreviousId)">
			<i
				id="left-link-handler"
				class="fas fa-magnet"
				*ngIf="checkShowLeftLinkHandler(card)"
				[ngClass]="card.linkedPreviousId ? 'fa-rotate-270' : 'fa-rotate-90'"></i>
		</div>
		<div (click)="linkPrevious(card, card.linkedPreviousId)">
			<i
				id="right-link-handler"
				class="fas fa-magnet"
				*ngIf="checkShowRightLinkHandler(card)"
				[ngClass]="card.linkedNextId ? 'fa-rotate-90' : 'fa-rotate-270'"></i>
		</div>
	</div>
	<div appResizableCard [card]="card" class="h-100 resizable-card-handler cursor-resize ml-auto"></div>
</div>
<div>{{check()}}</div>
