<div
	class="h-100 panel-card resizable"
	(mouseenter)="highlightOrderCards(card.day, card.order.number, true)"
	(mouseleave)="highlightOrderCards(card.day, card.order.number, false)"
	[ngStyle]="{
		'width.px': card.width,
		'background-color': findBackground(card.type),
		'border': findBorder(card.highlight)
	}">
	<div class="h-100 d-flex flex-column">
		<div class="d-flex">
			<div class="flex-grow-1 flex-basis-0 align-center">
				<span *ngIf="checkFirstCard(card.linkedPrevious)">{{card.order.code}}</span>
			</div>
			<div class="flex-grow-1 flex-basis-0 align-center">
				<div
					*ngIf="checkFirstCard(card.linkedPrevious)"
					class="align-center card-state-indicator"
					[style.background-color]="getOrderStateColor(card.order.state)">
					<strong>{{findVehiclePosition(card.vehiclePosition)}}</strong>
				</div>
			</div>
			<div class="flex-grow-1 flex-basis-0 align-center">
				<span *ngIf="checkLastCard(card.linkedNext)">{{card.order.deadline | date: 'HH:mm'}}</span>
			</div>
		</div>
		<div class="flex-grow-1 flex-basis-0 d-flex">
			<div class="flex-grow-1 flex-basis-0 align-center">
				<div *ngIf="checkShowDivisionInfo(card.dividedPrevious, card.dividedNext)" class="d-flex">
					<div *ngIf="checkShowLeftDivisionInfo(card.dividedPrevious)">
						<span>{{findDividedPreviousPosition(card.dividedPrevious)}}</span>
						<i class="fas fa-long-arrow-alt-{{checkArrowDirection(card, card.dividedPrevious)}}"></i>
					</div>
					<div *ngIf="checkShowRightDivisionInfo(card.dividedNext)">
						<span>{{findDividedPreviousPosition(card.dividedNext)}}</span>
						<i class="fas fa-long-arrow-alt-{{checkArrowDirection(card, card.dividedNext)}}"></i>
					</div>
				</div>
			</div>
			<div class="flex-grow-1 flex-basis-0 align-center">
				{{card.group.shortName}}
			</div>
			<div class="flex-grow-1 flex-basis-0 align-center custom-icon">
				<i
					*ngIf="checkShowCustomIcon()"
					class="fas fa-{{findCustomIcon()}}"
					[ngStyle]="{'color': findCustomIconColor()}">
				</i>
			</div>
		</div>
		<div
			class="d-flex card-bottom-section"
			[style.background]="findBottomSectionBackground(card.divisionIndex, card.group.color.code)">
			<div class="flex-grow-1 flex-basis-0 align-center"></div>
			<div class="flex-grow-1 flex-basis-0 align-center"></div>
			<div class="flex-grow-1 flex-basis-0 align-center"></div>
		</div>
	</div>
	<div class="w-100 h-100 d-flex align-items-center link-cards-container">
		<div
			*ngIf="checkShowLeftLinkHandler(card)"
			class="link-handler"
			[style.background-image]="'url(\'../../../assets/img/' + findLinkImage(card.linkedPrevious) + '\')'"
			(click)="handlePreviousLink(card)">
		</div>
		<div
			*ngIf="checkShowRightLinkHandler(card)"
			class="link-handler fa-rotate-180 ml-auto"
			[style.background-image]="'url(\'../../../assets/img/' + findLinkImage(card.linkedNext) + '\')'"
			(click)="handleNextLink(card)">
		</div>
	</div>
	<div appResizableCard [card]="card" class="h-100 resizable-card-handler cursor-resize ml-auto"></div>
</div>
<div>{{check()}}</div>
