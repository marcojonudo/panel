<div
	class="h-100 d-flex flex-column tools-bar-container border-left border-semi-dark"
	[style.width.px]="toolsBarWidth">
	<app-appointments-summary
		*ngIf="checkShowAppointmentsSummary()"
		[day]="day"
		[appointmentDayUpdate]="appointmentDayUpdate"
		[enabled]="checkEnableSchedulesButtons()">
	</app-appointments-summary>
	<div class="d-flex flex-column text-white">
		<div
			class="align-center tools-bar-button pt-2 pb-1 border-bottom"
			(click)="syncJpdv()">
			<i
				class="fas fa-sync-alt"
				[ngClass]="{'fa-spin': syncing}">
			</i>
		</div>
		<div
			class="align-center tools-bar-button pt-2 pb-1 border-bottom"
			[ngClass]="{'disabled': !checkToggleDayMode(), 'tools-bar-button-pressed': !oneDayMode}"
			(click)="toggleDayMode()">
			<i class="fas fa-binoculars fa-lg"></i>
		</div>
		<div
			class="align-center tools-bar-button pt-1 pb-1 border-bottom"
			[ngClass]="{'disabled': !checkEnableSchedulesButtons(), 'tools-bar-button-pressed': onlyAppointmentsMode}"
			(click)="toggleShowMechanicsWithoutAppointments()">
			<i class="fas fa-user-friends"></i>
		</div>
		<div
			class="align-center tools-bar-button pt-1 pb-1 border-bottom"
			[ngClass]="{'disabled': !checkEnableSchedulesButtons(), 'tools-bar-button-pressed': !showAppointmentsName}"
			(click)="toggleShowAppointmentsName()">
			<i class="fas fa-tag"></i>
		</div>
		<div
			class="align-center tools-bar-button pt-1 pb-1 border-bottom"
			[ngClass]="{'disabled': !checkEnableSchedulesButtons(), 'tools-bar-button-pressed': dragScheduleMode}"
			(click)="toggleDragSchedulesMode()">
			<i class="fas fa-paint-brush"></i>
		</div>
	</div>
	<app-dimension-sliders
		[maxScheduleWidth]="maxScheduleWidth"
		[maxScheduleMaxWidth]="maxScheduleMaxWidth">
	</app-dimension-sliders>
	<div
		appDropzone
		[type]="finishDropzoneType"
		class="align-center mt-auto mb-2 tools-bar-button"
		(click)="showFinishedCardsBar()">
