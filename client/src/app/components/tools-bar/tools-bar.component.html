<div
	class="h-100 d-flex flex-column tools-bar-container"
	[style.width.px]="toolsBarWidth">
	<div
		class="d-flex flex-column appointments-summary-container"
		(click)="openAppointmentsDetails()">
		<span class="align-center appointments-summary-title">Citas</span>
		<div
			*ngFor="let item of findDayAppointmentsCounter(day) | keyvalue"
			class="d-flex flex-column appointment-summary-item">
			<span class="align-center flex-grow-1 flex-basis-0">{{item.key}}</span>
			<span class="align-center flex-grow-1 flex-basis-0">{{findSaturationPercentage(item.value.total, item.value.max)}}%</span>
			<div class="d-flex flex-grow-1 flex-basis-0">
				<div
					class="flex-grow-1 flex-basis-0 align-center"
					[ngClass]="checkSaturation(item.value.morning, item.value.max, morningAppointmentSaturation) ? 'background-color-red' : 'background-color-green'">
					M
				</div>
				<div
					class="flex-grow-1 flex-basis-0 align-center"
					[ngClass]="checkSaturation(item.value.afternoon, item.value.max, afternoonAppointmentSaturation) ? 'background-color-red' : 'background-color-green'">
					T
				</div>
			</div>
		</div>
	</div>
	<div class="d-flex flex-column align-items-center">
		<div
			class="mt-1 mb-1"
			(click)="toggleDayMode()">
			<i class="fas fa-binoculars fa-lg"></i>
		</div>
		<div
			class="mt-1 mb-1"
			(click)="toggleShowMechanicsWithoutAppointments()">
			<i class="fas fa-user-friends"></i>
		</div>
		<div
			class="mt-1 mb-1"
			(click)="toggleShowAppointmentsName()">
			<i class="fas fa-tag"></i>
		</div>
	</div>
	<hr class="w-75">
	<app-dimension-sliders
		[maxScheduleWidth]="maxScheduleWidth"
		[maxScheduleMaxWidth]="maxScheduleMaxWidth"
		class="w-100 flex-grow-1">
	</app-dimension-sliders>
	<div
		appDropzone
		[type]="finishDropzoneType"
		class="align-center mb-2"
		(click)="showFinishedCardsBar()">
		<i class="far fa-2x fa-trash-alt"></i>
	</div>
</div>
