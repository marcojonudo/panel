<div
	class="h-100 lateral-panel-container blank-background"
	[ngClass]="{'border-left border-semi-dark': info != undefined}"
	[style.width.px]="findLateralPanelWidth()">
	<app-skills-details
		class="lateral-panel-item"
		[ngClass]="checkShow(mechanicSkillsType) ? 'show' : 'hide'"
		[mechanicSkills]="findParams(mechanicSkillsType)">
	</app-skills-details>
	<app-card-details
		class="lateral-panel-item"
		[ngClass]="checkShow(cardDetailsType) ? 'show' : 'hide'"
		[card]="findParams(cardDetailsType)">
	</app-card-details>
	<app-appointments-panel
		class="lateral-panel-item"
		[ngClass]="checkShow(appointmentsDetailsType) ? 'show' : 'hide'"
		[day]="day"
		[appointmentDayUpdate]="findParams(appointmentsDetailsType)">
	</app-appointments-panel>
</div>
