<div class="container-fluid d-flex flex-column w-100 h-100">
	<div
		class="row assigned-orders-container">
		<div *ngIf="oneDayMode" class="col h-100 padding-0 d-flex">
			<div
				appScrollable
				class="flex-grow-1 h-100 panel-container padding-0"
				[ngClass]="{
					'width-0-scrollbar': !displayScrollbar,
					'overflow-scroll': !showNonexistentScheduleMessage,
					'overflow-hidden': showNonexistentScheduleMessage
				}">
				<div
					class="h-100"
					[style.width.px]="maxScheduleWidth">
					<app-day-panel
						class="animated slideInRight"
						[day]="today"
						[quartersSaturation]="findQuartersSaturation(today)"
						[mechanicLineUpdate]="checkTriggerLineCd(today)"
						[dayMechanicSkills]="checkTriggerInfoCd(today)"
						[maxScheduleHours]="maxScheduleHours"
						[maxScheduleWidth]="maxScheduleWidth">
					</app-day-panel>
				</div>
				<div
					*ngIf="showNonexistentScheduleMessage"
					class="w-100 h-100 align-center nonexistent-today-schedules-container">
					No hay horarios definidos para hoy. ¡Puedes tomarte el día libre!
				</div>
			</div>
			<app-card-details
				*ngIf="checkShowCardDetails(today)"
				[card]="findCard(today)"
				class="h-100"
				[style.right.px]="skillsDetailsRight">
			</app-card-details>
			<app-skills-details
				*ngIf="checkShowSkills(today)"
				[skills]="findSkills(today)"
				class="h-100"
				[style.right.px]="skillsDetailsRight">
			</app-skills-details>
			<app-day-info-panel
				class="h-100"
				[style.min-width.px]="dayPanelWidth"
				[day]="today">
			</app-day-info-panel>
			<app-tools-bar
				[maxScheduleWidth]="maxScheduleWidth"
				[maxScheduleMaxWidth]="maxScheduleMaxWidth"
				class="h-100">
			</app-tools-bar>
		</div>
		<div *ngIf="!oneDayMode" class="col w-100 h-100 padding-0 d-flex parent-sections-container">
			<div
				class="d-flex flex-column"
				appScrollable
				[style.width.px]="dayContainerWidth"
				[ngClass]="{'overflow-y-scroll': !oneDayMode}">
				<div
					*ngFor="let day of days | days: oneDayMode; trackBy: trackByDay;"
					class="w-100 h-auto d-flex"
					[ngClass]="{'overflow-hidden': oneDayMode}">
					<div
						class="h-100 panel-container padding-0"
						[ngClass]="{
							'width-0-scrollbar': !oneDayMode || !displayScrollbar,
							'overflow-scroll': !showNonexistentScheduleMessage,
							'overflow-hidden': showNonexistentScheduleMessage
						}">
						<div
							class="h-100"
							[style.width.px]="maxScheduleWidth">
							<app-day-panel
								class="animated slideInRight"
								[day]="day"
								[quartersSaturation]="findQuartersSaturation(day)"
								[mechanicLineUpdate]="checkTriggerLineCd(day)"
								[dayMechanicSkills]="checkTriggerInfoCd(day)"
								[maxScheduleHours]="maxScheduleHours"
								[maxScheduleWidth]="maxScheduleWidth">
							</app-day-panel>
						</div>
					</div>
					<app-card-details
						*ngIf="checkShowCardDetails(day)"
						[card]="findCard(day)"
						class="h-100"
						[style.right.px]="skillsDetailsRight">
					</app-card-details>
					<app-skills-details
						*ngIf="checkShowSkills(day)"
						[skills]="findSkills(day)"
						[style.right.px]="skillsDetailsRight"
						class="h-100">
					</app-skills-details>
					<app-day-info-panel
						class="h-100"
						[style.min-width.px]="dayPanelWidth"
						[day]="day">
					</app-day-info-panel>
				</div>
			</div>
			<app-tools-bar
				[maxScheduleWidth]="maxScheduleWidth"
				[maxScheduleMaxWidth]="maxScheduleMaxWidth"
				class="h-100">
			</app-tools-bar>
		</div>
	</div>
	<div class="row unassigned-orders-container">
		<div class="col padding-0">
			<app-band class="w-100"></app-band>
		</div>
	</div>
</div>
<div>{{check()}}</div>
