<div
	*ngIf="checkExistentSchedules(); else emptyPanel"
	class="container-fluid d-flex flex-column w-100 h-100"
	[style.cursor]="findCursor()">
	<div
		class="row assigned-orders-container">
		<div *ngIf="oneDayMode" class="col h-100 padding-0 d-flex">
			<div
				*ngIf="todaySchedules; else emptyDay"
				appScrollable
				[initialScrollLeft]="initialScrollLeft"
				class="h-100 panel-container padding-0"
				[ngClass]="{
					'width-0-scrollbar': !displayVerticalScrollbar,
					'overflow-scroll': todaySchedules,
					'overflow-hidden': !todaySchedules
				}">
				<div
					class="h-100"
					[style.width.px]="maxScheduleWidth">
					<app-day-panel
						class="animated fadeIn"
						[day]="today"
						[mechanics]="findDayMechanics(today) | mechanics: onlyAppointmentsMode"
						[saturatedQuarters]="findDaySaturatedQuarters(today)"
						[mechanicSkillsUpdate]="findDayMechanicSkillsUpdate(today)"
						[mechanicLineUpdates]="findMechanicLineUpdates(today)"
						[showAppointmentsName]="showAppointmentsName"
						[maxScheduleHoursQuarter]="maxScheduleHoursQuarter"
						[maxScheduleWidth]="maxScheduleWidth"
						[timeIndicatorLeft]="timeIndicatorLeft"
						[mechanicGroupUpdates]="findGroupsUpdate(today)">
					</app-day-panel>
				</div>
			</div>
			<ng-template #emptyDay>
				<div class="flex-grow-1 h-100 align-center nonexistent-today-schedules-container">
					No hay horarios definidos para hoy. ¡Puedes tomarte el día libre!
				</div>
			</ng-template>
			<app-lateral-panel
				[day]="today"
				[info]="findLateralPanelInfo(today)"
				[style.right.px]="lateralPanelRight">
			</app-lateral-panel>
			<app-tools-bar
				[day]="today"
				[appointmentDayUpdate]="findAppointmentDayUpdate(today)"
				[maxScheduleWidth]="maxScheduleWidth"
				[maxScheduleMaxWidth]="maxScheduleMaxWidth">
			</app-tools-bar>
		</div>
		<div *ngIf="!oneDayMode" class="col w-100 h-100 padding-0 d-flex parent-sections-container">
			<div
				class="d-flex flex-column overflow-y-scroll"
				appScrollable
				[style.width.px]="dayContainerWidth">
				<div
					*ngFor="let day of days | days: oneDayMode; trackBy: trackByDay;"
					class="h-auto d-flex"
					[style.width.px]="maxScheduleWidth + toolsBarWidth">
					<app-day-panel
						class="w-100 flex-grow-1 flex-basis-0 animated fadeIn"
						[day]="day"
						[mechanics]="findDayMechanics(day) | mechanics: onlyAppointmentsMode"
						[saturatedQuarters]="findDaySaturatedQuarters(day)"
						[mechanicSkillsUpdate]="findDayMechanicSkillsUpdate(day)"
						[mechanicLineUpdates]="findMechanicLineUpdates(day)"
						[showAppointmentsName]="showAppointmentsName"
						[maxScheduleHoursQuarter]="maxScheduleHoursQuarter"
						[maxScheduleWidth]="maxScheduleWidth"
						[mechanicGroupUpdates]="findGroupsUpdate(day)">
					</app-day-panel>
					<app-lateral-panel
						[day]="day"
						[info]="findLateralPanelInfo(day)"
						[style.right.px]="lateralPanelRight">
					</app-lateral-panel>
					<app-appointments-summary
						class="appointments-summary blank-background border-left border-semi-dark"
						[style.width.px]="toolsBarWidth"
						[day]="day"
						[appointmentDayUpdate]="findAppointmentDayUpdate(day)"
						[width]="toolsBarWidth"
						[enabled]="true">
					</app-appointments-summary>
				</div>
			</div>
			<app-tools-bar
				[maxScheduleWidth]="maxScheduleWidth"
				[maxScheduleMaxWidth]="maxScheduleMaxWidth"
				class="h-100">
			</app-tools-bar>
		</div>
	</div>
	<div class="row unassigned-orders-container">
		<div class="col padding-0">
			<app-band class="w-100 blank-background"></app-band>
		</div>
	</div>
</div>
<ng-template #emptyPanel>
	<div class="w-100 h-100 align-center nonexistent-today-schedules-container">
		No hay horarios definidos. Por favor, cárgalos antes de acceder a panel.
	</div>
</ng-template>
<app-context-menu
	*ngIf="checkShowContextMenu()"
	[contextMenuInfo]="contextMenuInfo">
</app-context-menu>
<app-toasts-container
	class="toast-position"
	[toast]="toast">
</app-toasts-container>
<div>{{check()}}</div>
