<div
	class="container-fluid d-flex flex-column w-100 h-100"
	[style.cursor]="findCursor()">
	<div
		class="row assigned-orders-container">
		<div *ngIf="oneDayMode" class="col h-100 padding-0 d-flex">
			<div
				appScrollable
				[initialScrollLeft]="initialScrollLeft"
				class="flex-grow-1 h-100 panel-container padding-0"
				[ngClass]="{
					'width-0-scrollbar': !displayVerticalScrollbar,
					'overflow-scroll': !showNonexistentScheduleMessage,
					'overflow-hidden': showNonexistentScheduleMessage
				}">
				<div
					class="h-100"
					[style.width.px]="maxScheduleWidth">
					<app-day-panel
						class="animated fadeIn"
						[day]="today"
						[mechanics]="findDayMechanics(today) | mechanics: onlyAppointmentsMode"
						[quartersSaturation]="findQuartersSaturation(today)"
						[mechanicLineUpdate]="checkTriggerLineCd(today)"
						[dayMechanicSkills]="findDayMechanicSkills(today)"
						[contextMenuInfo]="findAssignedContextMenuInfo()"
						[showAppointmentsName]="showAppointmentsName"
						[maxScheduleHours]="maxScheduleHours"
						[maxScheduleHoursQuarter]="maxScheduleHoursQuarter"
						[maxScheduleWidth]="maxScheduleWidth"
						[timeIndicatorLeft]="timeIndicatorLeft">
					</app-day-panel>
				</div>
				<div
					*ngIf="showNonexistentScheduleMessage"
					class="w-100 h-100 align-center nonexistent-today-schedules-container">
					No hay horarios definidos para hoy. ¡Puedes tomarte el día libre!
				</div>
			</div>
			<app-lateral-panel
				[info]="findLateralInfo(today)"
				[style.right.px]="lateralPanelRight">
			</app-lateral-panel>
			<app-tools-bar
				[day]="today"
				[dayAppointmentsCounterUpdate]="findDayAppointmentsCounterUpdate(today)"
				[maxScheduleWidth]="maxScheduleWidth"
				[maxScheduleMaxWidth]="maxScheduleMaxWidth">
			</app-tools-bar>
		</div>
		<div *ngIf="!oneDayMode" class="col w-100 h-100 padding-0 d-flex parent-sections-container">
			<div
				class="d-flex flex-column overflow-y-scroll"
				appScrollable
				[style.width.px]="dayContainerWidth">
				<div
					*ngFor="let day of days | days: oneDayMode; trackBy: trackByDay;"
					class="h-auto d-flex"
					[style.width.px]="maxScheduleWidth + toolsBarWidth">
					<app-day-panel
						class="w-100 animated fadeIn"
						[day]="day"
						[mechanics]="findDayMechanics(day) | mechanics: onlyAppointmentsMode"
						[quartersSaturation]="findQuartersSaturation(day)"
						[mechanicLineUpdate]="checkTriggerLineCd(day)"
						[dayMechanicSkills]="findDayMechanicSkills(day)"
						[contextMenuInfo]="findAssignedContextMenuInfo()"
						[showAppointmentsName]="showAppointmentsName"
						[maxScheduleHours]="maxScheduleHours"
						[maxScheduleHoursQuarter]="maxScheduleHoursQuarter"
						[maxScheduleWidth]="maxScheduleWidth">
					</app-day-panel>
					<app-lateral-panel
						[info]="findLateralInfo(day)"
						[style.right.px]="lateralPanelRight">
					</app-lateral-panel>
					<app-appointments-summary
						class="appointments-summary blank-background border-left border-semi-dark"
						[style.width.px]="toolsBarWidth"
						[day]="day"
						[dayAppointmentsCounterUpdate]="findDayAppointmentsCounterUpdate(day)"
						[width]="toolsBarWidth">
					</app-appointments-summary>
				</div>
			</div>
			<app-tools-bar
				[maxScheduleWidth]="maxScheduleWidth"
				[maxScheduleMaxWidth]="maxScheduleMaxWidth"
				class="h-100">
			</app-tools-bar>
		</div>
	</div>
	<div class="row unassigned-orders-container">
		<div class="col padding-0">
			<app-band
				class="w-100"
				[contextMenuInfo]="findUnassignedContextMenuInfo()">
			</app-band>
		</div>
	</div>
</div>
<app-drag-schedule-context-menu
	*ngIf="checkShowDragScheduleContextMenu()"
	[contextMenuInfo]="findDragScheduleContextMenuInfo()">
</app-drag-schedule-context-menu>
<app-toasts-container
	class="toast-position"
	[toast]="toast">
</app-toasts-container>
<div>{{check()}}</div>
