<div class="container-fluid d-flex flex-column w-100 h-100">
	<div
		class="row assigned-orders-container">
		<div class="col h-100 padding-0 d-flex">
			<div
				appScrollable
				class="flex-grow-1 h-100 panel-container padding-0 overflow-scroll"
				[ngClass]="{'width-0-scrollbar': !displayScrollbar}">
				<div
					class="h-100"
					[style.width.px]="maxScheduleWidth">
					<app-day-panel
						class="animated slideInRight"
						[index]="i"
						[day]="day"
						[maxScheduleHours]="maxScheduleHours"
						[maxScheduleWidth]="maxScheduleWidth"
						*ngFor="let day of days | days: oneDayMode; trackBy: trackByDay; let i = index"></app-day-panel>
				</div>
			</div>
			<app-skills-details class="h-100"></app-skills-details>
			<app-day-info-panel class="h-100"></app-day-info-panel>
			<app-tools-bar class="h-100"></app-tools-bar>
		</div>
	</div>
	<div class="row unassigned-orders-container">
		<div class="col padding-0">
			<app-band class="w-100"></app-band>
		</div>
	</div>
</div>
<div>{{check()}}</div>
