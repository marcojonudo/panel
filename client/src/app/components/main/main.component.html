<div class="container-fluid d-flex flex-column w-100 h-100">
	<div
		class="row assigned-orders-container">
		<div class="col w-100 h-100 padding-0 d-flex parent-sections-container">
			<div
				class="d-flex flex-column"
				[style.width.px]="dayContainerWidth"
				[ngClass]="{'overflow-y-scroll': !oneDayMode}">
				<div
					*ngFor="let day of days | days: oneDayMode; trackBy: trackByDay;"
					class="w-100 h-auto d-flex"
					[ngClass]="{'overflow-hidden': oneDayMode}">
					<div
						appScrollable
						class="h-100 panel-container padding-0"
						[ngClass]="{
							'width-0-scrollbar': !oneDayMode || !displayScrollbar,
							'overflow-scroll': !showNonexistentScheduleMessage,
							'overflow-hidden': showNonexistentScheduleMessage
						}">
						<div
							class="h-100"
							[style.width.px]="maxScheduleWidth">
							<app-day-panel
								class="animated slideInRight"
								[day]="day"
								[dayCardUpdate]="checkTriggerCd(day)"
								[dayCardsGroups]="findDayCardsGroups(day)"
								[maxScheduleHours]="maxScheduleHours"
								[maxScheduleWidth]="maxScheduleWidth">
							</app-day-panel>
						</div>
					</div>
					<app-day-info-panel
						class="h-100"
						[style.min-width.px]="dayPanelWidth"
						[day]="day">
					</app-day-info-panel>
				</div>
			</div>
			<app-skills-details
				*ngIf="showSkills"
				[skills]="skills"
				[style.right.px]="skillsDetailsRight"
				class="h-100"></app-skills-details>
			<app-tools-bar class="h-100"></app-tools-bar>
		</div>
	</div>
	<div class="row unassigned-orders-container">
		<div class="col padding-0">
			<app-band class="w-100"></app-band>
		</div>
	</div>
</div>
<div>{{check()}}</div>
