<div
	class="d-flex align-center justify-content-start context-menu-item"
	[ngClass]="{'rounded selected-option': checkCutCardSelected()}"
	(click)="cutCard()">
	<i class="fas fa-cut context-menu-icon"></i>
	<span>Cortar</span>
</div>
<div
	class="d-flex align-center justify-content-start context-menu-item"
	(click)="cutCardByHalf()">
	<i class="fas fa-divide context-menu-icon"></i>
	<span>Dividir</span>
</div>
<div
	class="d-flex align-center justify-content-start context-menu-item"
	(click)="showCardDetails()">
	<i class="fas fa-clipboard context-menu-icon"></i>
	<span>Detalles</span>
</div>
