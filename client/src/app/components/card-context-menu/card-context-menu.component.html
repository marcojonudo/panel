<div
	class="d-flex p-1 rounded border context-menu-container"
	[ngStyle]="{
		'left.px': findLeft(contextMenuInfo.clickCoordinates.x),
		'top.px': findTop(contextMenuInfo.cardTop)
	}">
	<div class="p-1 mr-1">
		<i class="fas fa-cut fa-2x"></i>
	</div>
	<div class="p-1">
		<i class="fas fa-copy fa-2x"></i>
	</div>
</div>
