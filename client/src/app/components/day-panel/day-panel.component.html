<div
	class="w-100 scrollable-container animated fadeIn">
	<div class="w-100 h-100">
		<app-timeline-container
			[day]="day"
			[quartersSaturation]="quartersSaturation"
			[maxScheduleHours]="maxScheduleHours"
			[maxScheduleWidth]="maxScheduleWidth"
			class="timeline-container-wrapper"></app-timeline-container>
		<app-grid
			[day]="day"
			[mechanics]="mechanics"
			[mechanicLineUpdate]="mechanicLineUpdate"
			[dayMechanicSkills]="dayMechanicSkills"
			[maxScheduleWidth]="maxScheduleWidth">
		</app-grid>
		<app-card-context-menu
			*ngIf="checkShowContextMenu()"
			[contextMenuInfo]="contextMenuInfo"
		></app-card-context-menu>
	</div>
</div>
<div>{{checkDayPanel()}}</div>
