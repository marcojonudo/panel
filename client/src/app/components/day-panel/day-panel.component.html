<div
	class="w-100 scrollable-container animated fadeIn">
	<div class="w-100 h-100">
		<app-timeline-container
			[day]="day"
			[maxScheduleHoursQuarter]="maxScheduleHoursQuarter"
			[saturatedQuarters]="saturatedQuarters"
			[maxScheduleWidth]="maxScheduleWidth"
			class="timeline-container-wrapper">
		</app-timeline-container>
		<app-time-indicator
			*ngIf="checkShowTimeIndicator()"
			[left]="timeIndicatorLeft"
			[height]="timeIndicatorHeight">
		</app-time-indicator>
		<app-grid
			[day]="day"
			[mechanics]="mechanics"
			[mechanicLineUpdates]="mechanicLineUpdates"
			[mechanicSkillsUpdate]="mechanicSkillsUpdate"
			[showAppointmentsName]="showAppointmentsName"
			[mechanicGroupUpdate]="mechanicGroupUpdate">
		</app-grid>
	</div>
</div>
<div>{{checkDayPanel()}}</div>
