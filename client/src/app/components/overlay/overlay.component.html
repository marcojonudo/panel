<app-draggable-group
	*ngIf="helperGroup"
	appMovable
	class="helper-cards-group"
	[ngStyle]="{
		'height.px': lineDefaultHeight,
		'transition': (dragging ? 'none' : 'transform') + ' ' + translateDuration + 'ms'
	}"
	[group]="helperGroup"
	[coordinates]="coordinates"
	(transitionend)="updateCard()">
</app-draggable-group>
<div>{{check()}}</div>
