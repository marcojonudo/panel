<div class="w-100 h-100 overlay">
	<!-- TODO Revisar check de la ficha al hacer dragging -->
	<div
		*ngIf="helperCards && helperCards.length"
		appMovable
		class="d-flex helper-card-container"
		[ngClass]="{'transform-transition': !dragging}"
		[style.height.px]="(lineHeight$ | async) / 2"
		(transitionend)="updateCard()">
		<app-helper-card
			*ngFor="let card of helperCards"
			[card]="card"
			class="helper-card">
		</app-helper-card>
	</div>
</div>
<div>{{check()}}</div>
