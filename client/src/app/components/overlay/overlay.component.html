<app-helper-draggable-group
	*ngIf="helperCardsGroup"
	appMovable
	class="helper-cards-group"
	[ngStyle]="{'transition': (dragging ? 'none' : 'transform') + ' ' + translateDuration + 'ms'}"
	[style.height.px]="lineHeight$ | async"
	[cardsGroup]="helperCardsGroup"
	[coordinates]="coordinates"
	(transitionend)="updateCard()">
</app-helper-draggable-group>
<div>{{check()}}</div>
