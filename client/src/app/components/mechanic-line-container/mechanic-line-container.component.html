<div class="d-flex align-items-center mechanic-line-container border-top border-bottom border-light"
	 [style.height.px]="calcScheduleHeight()">
	<app-mechanic-info
		[day]="day"
		[mechanic]="mechanic"
		[position]="position"
		[highlight]="checkHighlightMechanic()"
		class="h-100 mechanic-info-container"
		[style.width.px]="mechanicInfoWidth">
	</app-mechanic-info>
	<app-mechanic-line
		[day]="day"
		[mechanic]="mechanic"
		[groups]="groups"
		[mechanicLineUpdate]="mechanicLineUpdate"
		[appointments]="mechanic.appointments"
		[showAppointmentsName]="showAppointmentsName"
		[groupUpdate]="groupUpdate"
		class="h-100 flex-grow-1">
	</app-mechanic-line>
	<div
		class="w-100 resizable cursor-resize"
		appResizableLine
		[mechanic]="mechanic">
	</div>
</div>
<div>{{check()}}</div>
