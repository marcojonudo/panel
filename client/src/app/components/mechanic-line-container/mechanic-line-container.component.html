<div class="d-flex align-items-center mechanic-line-container"
	 [style.height.px]="mechanic.height">
	<!--<div-->
		<!--class="h-100 mechanic-info-container d-flex align-items-center border-right-2 border-semi-dark"-->
		<!--[style.width.px]="mechanicInfoWidth">-->
		<app-mechanic-info
			class="h-100 mechanic-info-container"
			[style.width.px]="mechanicInfoWidth"
			[day]="day"
			[mechanic]="mechanic"
			[position]="position"></app-mechanic-info>
	<!--</div>-->
	<app-mechanic-line [day]="day"
					   [mechanic]="mechanic"
					   [maxScheduleHours]="maxScheduleHours"
					   class="h-100 flex-grow-1"></app-mechanic-line>
	<div appResizableLine [mechanic]="mechanic" class="w-100 resizable cursor-resize"></div>
</div>
<div>{{check()}}</div>
