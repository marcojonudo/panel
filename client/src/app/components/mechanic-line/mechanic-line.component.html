<div
	class="h-100 mechanic-line">
	<div class="h-100 d-flex schedule-line"
		 appDropzone
		 [mechanic]="mechanic"
		 *ngFor="let duration of mechanic.schedule.minutes; let i = index"
		 [ngStyle]="{
		 	'width.px': calcScheduleWidth(duration),
		 	'left.px': calcScheduleLeft(mechanic.schedule.thresholds[i*2]),
		 	'background': calcScheduleLineBackground(mechanic.schedule.quarters[i])
		}">
		<!--<div *ngFor="let quarter of mechanic.schedule.quarters[i]; trackBy: trackByItem"-->
			 <!--class="flex-grow-1 flex-basis-0 d-flex quarter">-->
		<!--</div>-->
	</div>
	<app-draggable-group
		*ngFor="let cardsGroup of cardsGroups"
		class="assigned-card"
		[ngClass]="{'hidden': checkHideGroup(cardsGroup.id)}"
		[ngStyle]="{
			'height.px': lineHeight$ | async,
			'transform': 'translateX(' + cardsGroup.left + 'px) translateY(' + cardsGroup.cards[0].line * 100 + '%)'
		}"
		(hiddenCardsGroup)="setHiddenCardsGroup($event)"
		[cardsGroup]="cardsGroup">
	</app-draggable-group>
</div>
<div>{{check()}}</div>
