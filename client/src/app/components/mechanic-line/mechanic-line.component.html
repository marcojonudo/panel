<div
	class="h-100 mechanic-line">
	<div class="h-100 d-flex schedule-line"
		 appDropzone
		 [mechanic]="mechanic"
		 *ngFor="let percentage of getSchedulePercentages(); let i = index"
		[ngStyle]="{'width.%': percentage, 'left.%': getLeftPercentages()[i]}">
		<div *ngFor="let quarter of mechanic.schedule.quarters[i]; trackBy: trackByItem"
			 class="flex-grow-1 flex-basis-0 d-flex border-right border-semi-dark"
			 [ngClass]="{'border-right-2': quarter == 45}">
		</div>
	</div>
	<app-draggable-group
		*ngFor="let cardsGroup of cardsGroups"
		class="assigned-card"
		[ngClass]="{'hidden': hide}"
		[ngStyle]="{
			'height.px': lineHeight$ | async,
			'transform': 'translateX(' + cardsGroup.left + 'px) translateY(' + cardsGroup.cards[0].line * 100 + '%)'
		}"
		(hide)="hideGroup($event)"
		[cardsGroup]="cardsGroup">
	</app-draggable-group>
</div>
<div>{{check()}}</div>
