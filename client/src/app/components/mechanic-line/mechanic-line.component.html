<div
	[id]="mechanicLineId"
	class="h-100 mechanic-line">
	<div
		*ngFor="let appointment of mechanic.appointments"
		class="d-flex appointment-schedule-container"
		[ngStyle]="{
			'width.px': calcScheduleWidth(appointment.interval.duration),
			'height.px': calcScheduleHeight(mechanic.panelInfo.lines),
			'left.px': calcScheduleLeft(appointment.interval.start)
		}">
		<div class="w-100 appointment-schedule d-flex">
			<div
				class="w-100 align-center"
				[style.background-color]="appointment.appointmentType.color">
				<span *ngIf="showAppointmentsName" class="appointment-schedule-text">{{appointment.appointmentType.name}}</span>
			</div>
			<div
				class="schedule-border schedule-left-border"
				[ngStyle]="buildAppointmentBorderStyle(
					mechanic.intervals,
					appointment.interval.start,
					appointment.appointmentType.color
				)"
				appDragSchedule
				[mechanic]="mechanic"
				[appointment]="appointment"
				[behaviour]="createUpdateScheduleBehaviour(true)">
			</div>
			<div
				class="schedule-border schedule-right-border"
				[ngStyle]="buildAppointmentBorderStyle(
					mechanic.intervals,
					appointment.interval.end,
					appointment.appointmentType.color,
					false
				)"
				appDragSchedule
				[mechanic]="mechanic"
				[appointment]="appointment"
				[behaviour]="createUpdateScheduleBehaviour(false)">
			</div>
		</div>
	</div>
	<div
		*ngFor="let interval of mechanic.intervals"
		class="h-100 d-flex schedule-line"
		[ngStyle]="{
			'width.px': calcScheduleWidth(interval.duration),
		 	'left.px': calcScheduleLeft(interval.start)
		}"
		appDropzone
		[type]="assignedDropzoneType"
		[mechanic]="mechanic"
		[interval]="interval"
		[dropzoneUpdate]="checkUpdateDropzone(interval.start)"
		appDragSchedule
		[behaviour]="createCreateScheduleBehaviour()">
		<div
			class="schedule-border schedule-left-border pointer-events-none"
			[ngStyle]="{background: findScheduleLeftBorderBackground(redColor)}">
		</div>
		<div
			class="schedule-border schedule-right-border pointer-events-none"
			[ngStyle]="{background: findScheduleRightBorderBackground(redColor)}">
		</div>
		<div
			class="w-100 position-relative d-flex"
			[style.height.px]="calcScheduleHeight(mechanic.panelInfo.lines)">
			<div
				*ngFor="let quarter of interval.quarters"
				class="flex-grow-1 border-semi-dark"
				[ngClass]="checkStartHourQuarter(quarter) ? 'hour-border' : 'quarter-border'">
			</div>
		</div>
		<div
			class="w-100 schedule-job-line-type"
			[ngStyle]="{
				'height.px': jobLineTypeHeight,
				'background-color': findJobLineTypeColor(mechanic.jobLineType)
			}">
		</div>
	</div>
	<app-draggable-group
		*ngFor="let group of findGroups()"
		class="assigned-card"
		[ngClass]="{'hidden': checkHideGroup(group.id)}"
		[ngStyle]="{
			'height.px': lineDefaultHeight,
			'transform': 'translateX(' + group.left + 'px) translateY(' + group.cards[0].line * 100 + '%)'
		}"
		(hiddenCardsGroup)="setHiddenCardsGroup($event)"
		[group]="group"
		[groupUpdate]="checkUpdateGroup(group.id)">
	</app-draggable-group>
</div>
<div>{{check()}}</div>
