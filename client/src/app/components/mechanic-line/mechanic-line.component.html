<div
  #dropzone
  appDropzone
  [mechanic]="mechanic"
  class="h-100 d-flex mechanic-line">
  <div class="h-100 w-100 d-flex" style="position: absolute; left: 0; top: 0">
    <div *ngFor="let hour of hours; trackBy: trackByItem" class="flex-grow-1 flex-basis-0 d-flex border-right-2 border-semi-dark">
      <div *ngFor="let quarter of quarters; trackBy: trackByItem" class="flex-grow-1 flex-basis-0 border-right border-semi-dark quarter"></div>
    </div>
  </div>
  <div
    *ngFor="let card of cards"
    class="assigned-card"
    [ngStyle]="{'width.px': card.width, 'left': card.left + 'px'}"></div>
</div>
<div>{{check()}}</div>
