<div
	class="h-100 mechanic-line">
	<div
		class="h-100 d-flex schedule-line"
		appDropzone
		[type]="assignedDropzoneType"
		[mechanic]="mechanic"
		*ngFor="let interval of mechanic.schedule.intervals"
		[ngStyle]="{
			'width.px': calcScheduleWidth(interval.duration),
		 	'left.px': calcScheduleLeft(interval.start)
		}">
		<div class="schedule-border schedule-left-border"></div>
		<div class="schedule-border schedule-right-border"></div>
		<div
			class="w-100 h-100 position-relative d-flex"
			[style.height.px]="calcScheduleHeight(mechanic.lines)">
			<div
				*ngFor="let quarter of interval.quarters"
				class="flex-grow-1"
				[ngClass]="checkStartHourQuarter(quarter) ? 'hour-border' : 'quarter-border'">
			</div>
		</div>
		<div
			class="w-100 schedule-job-line-type"
			[ngStyle]="{
				'height.px': jobLineTypeHeight,
				'background-color': findJobLineTypeColor(mechanic.jobLineType)
			}">
		</div>
	</div>
	<div
		*ngFor="let appointment of mechanic.appointments | appointments"
		class="d-flex appointment-schedule"
		[ngStyle]="{
			'width.px': calcScheduleWidth(appointment.schedule.intervals[0].duration),
			'height.px': calcScheduleHeight(mechanic.lines),
			'left.px': calcScheduleLeft(appointment.schedule.intervals[0].start),
			'background-color': appointment.appointmentType.color
		}">
	</div>
	<app-draggable-group
		*ngFor="let group of findGroups(day, mechanic.code)"
		class="assigned-card"
		[ngClass]="{'hidden': checkHideGroup(group.id)}"
		[ngStyle]="{
			'height.px': lineDefaultHeight,
			'transform': 'translateX(' + group.left + 'px) translateY(' + group.cards[0].line * 100 + '%)'
		}"
		(hiddenCardsGroup)="setHiddenCardsGroup($event)"
		[cardsGroup]="group">
	</app-draggable-group>
</div>
<div>{{check()}}</div>
