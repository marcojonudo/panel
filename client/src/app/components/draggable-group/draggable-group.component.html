<div
	appDraggable
	[cardsGroup]="cardsGroup"
	class="h-100 d-flex draggable"
	(hiddenCardsGroup)="emitHiddenCardsGroup($event)">
	<app-card
		*ngFor="let card of cardsGroup.cards"
		[card]="card"
		[width]="card.width"
		[linkedNextId]="card.linkedNextId"
		[possibleLinkedNextId]="card.possibleLinkedNextId"
		[possibleLinkedPreviousId]="card.possibleLinkedPreviousId"></app-card>
</div>
<div>{{check()}}</div>
