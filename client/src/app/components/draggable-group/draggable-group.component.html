<div
	appClickable
	[group]="group"
	[cardBehaviour]="findCardBehaviour(group)"
	class="h-100 d-flex draggable group"
	[ngStyle]="{
		'cursor': findCursor(group.mode),
		'box-shadow': findHighlight(group.highlight)
	}"
	[style.cursor]="findCursor(group.mode)"
	(hiddenCardsGroup)="emitHiddenCardsGroup($event)"
	(mouseenter)="highlightOrderCards(group.day, group.cards[0].order.number, true)"
	(mouseleave)="highlightOrderCards(group.day, group.cards[0].order.number, false)">
	<app-card
		*ngFor="let card of group.cards"
		[card]="card"
		[width]="card.width">
	</app-card>
</div>
<div>{{check()}}</div>
