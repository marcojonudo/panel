<div
	appDraggable
	[cardsGroup]="group"
	[cardBehaviour]="findCardBehaviour(group)"
	class="h-100 d-flex draggable"
	[style.cursor]="findCursor(group.mode)"
	(hiddenCardsGroup)="emitHiddenCardsGroup($event)">
	<app-card
		*ngFor="let card of group.cards"
		[card]="card"
		[width]="card.width">
	</app-card>
</div>
<div>{{check()}}</div>
