<div
	appDraggable
	[cardsGroup]="cardsGroup"
	[cardBehaviour]="findCardBehaviour(cardsGroup)"
	class="h-100 d-flex draggable"
	[style.cursor]="findCursor(cardsGroup.mode)"
	(hiddenCardsGroup)="emitHiddenCardsGroup($event)">
	<app-card
		*ngFor="let card of cardsGroup.cards"
		[card]="card"
		[width]="card.width"
		[possibleLinkedNext]="card.possibleLinkedNext"
		[possibleLinkedPrevious]="card.possibleLinkedPrevious"></app-card>
</div>
<div>{{check()}}</div>
