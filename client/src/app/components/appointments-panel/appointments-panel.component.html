<div class="h-100 appointments-panel">
	<table class="table h-100">
		<thead>
			<tr>
				<th scope="col"></th>
				<th scope="col">Mañ.</th>
				<th scope="col">Tarde</th>
				<th scope="col">Total</th>
			</tr>
		</thead>
		<tbody>
			<tr *ngFor="let item of findDayAppointmentsCounter(day) | keyvalue">
				<th scope="row">{{item.key}}</th>
				<td>{{item.value.morning}}</td>
				<td>{{item.value.afternoon}}</td>
				<td class="d-flex">
					<div class="flex-grow-1 flex-basis-0 align-center">{{item.value.morning + item.value.afternoon}}</div>
					<div class="w-25 h-100 d-flex flex-column border-left">
						<div class="h-25 appointment-number-icon align-center" (click)="addMax(item.value)">
							<i class="fas fa-chevron-up"></i>
						</div>
						<div class="flex-grow-1 flex-basis-0 align-center max-appointment-limit">
							{{item.value.max}}
						</div>
						<div class="h-25 appointment-number-icon align-center" (click)="subtractMax(item.value)">
							<i class="fas fa-chevron-down"></i>
						</div>
					</div>
				</td>
			</tr>
		</tbody>
	</table>
</div>
