<div class="h-100 appointments-panel">
	<table class="table h-100">
		<thead>
		<tr>
			<th scope="col"></th>
			<th scope="col">Mañ.</th>
			<th scope="col">Tarde</th>
			<th scope="col">Total</th>
		</tr>
		</thead>
		<tbody>
		<tr *ngFor="let item of appointmentsCounter | keyvalue">
			<th scope="row">{{item.key}}</th>
			<td>{{item.value[morning]}}</td>
			<td>{{item.value[afternoon]}}</td>
			<td class="d-flex">
				<div class="flex-grow-1 flex-basis-0 align-center">{{item.value[total]}}</div>
				<div class="w-25 h-100 d-flex flex-column">
					<div class="h-50 appointment-number-icon align-center" (click)="toggleToolsBar()">
						<i class="fas fa-chevron-up"></i>
					</div>
					<div class="h-50 appointment-number-icon align-center" (click)="toggleToolsBar()">
						<i class="fas fa-chevron-down"></i>
					</div>
				</div>
			</td>
		</tr>
