<div
	class="d-flex flex-column drag-schedule-context-menu-container"
	[ngStyle]="{
		'left.px': findLeft(contextMenuInfo.clickCoordinates.x),
		'top.px': findTop(contextMenuInfo.clickCoordinates.y)
	}">
	<div
		*ngFor="let type of findAppointmentTypes()"
		class="drag-schedule-context-menu-item p-1"
		(click)="selectAppointmentType(type)">
		{{type.code}}
	</div>
</div>
