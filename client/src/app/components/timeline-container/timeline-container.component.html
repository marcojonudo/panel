<div class="d-flex timeline-container" [style.height.px]="timelineHeight">
	<div class="day h-100 align-center">{{day | date : 'dd/MM/yyyy'}}</div>
	<app-timeline
		[day]="day"
		[maxScheduleHoursQuarter]="maxScheduleHoursQuarter"
		[maxScheduleWidth]="maxScheduleWidth"
		[saturatedQuarters]="saturatedQuarters"
		class="flex-grow-1">
	</app-timeline>
</div>
<div>{{check()}}</div>
