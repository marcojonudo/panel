plugins {
	id "com.moowork.node" version "1.3.1"
}

node {
	version = '10.15.0'
	download = true
}

task start(type: NpmTask, dependsOn: 'npmInstall') {
	group = 'application'
	description = 'Run the client app'
	args = ['run', 'start']
}

task buildDev(type: NpmTask, dependsOn: 'npmInstall') {
	group = 'build'
	description = 'Compile client side assets for development'
	args = ['run', 'buildDev']
}

task build(type: NpmTask, dependsOn: 'npmInstall') {
	group = 'build'
	description = 'Compile client side assets for production'
	args = ['run', 'build']
}

task buildWatch(type: NpmTask, dependsOn: 'npmInstall') {
	group = 'application'
	description = 'Builds and watches the client side assets for rebuilding'
	args = ['run', 'buildWatch']
}

task test(type: NpmTask, dependsOn: 'npmInstall') {
	group = 'verification'
	description = 'Executes client side unit tests'
	args = ['run', 'test']
}

task integrationTest(type: NpmTask, dependsOn: 'npmInstall') {
	group = 'verification'
	description = 'Executes client side integration tests'
	args = ['run', 'e2e']
}
